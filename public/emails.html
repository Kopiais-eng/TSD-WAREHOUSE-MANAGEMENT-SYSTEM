<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TSD WMS | Emails</title>
  <script src="/theme.js"></script>
  <script src="/sidebar.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ---------- THEME VARIABLES ---------- */
    :root,
    [data-theme="dark"] {
      --bg-body:        #0b0e14;
      --bg-sidebar:     #141a24;
      --bg-main:        #0f131a;
      --bg-card:        #181f2b;
      --bg-elevated:    #1f2a3a;
      --bg-header:      #111820;
      --bg-hover:       #1a2332;

      --border:         #2a3344;
      --border-soft:    #252f3f;
      --border-row:     #1f2a3a;

      --text-primary:   #e2e8f0;
      --text-secondary: #cbd5e0;
      --text-muted:     #7a8ba3;
      --text-dim:       #a0b3cc;

      --accent:         #ef4444;
      --accent-hover:   #dc2626;
      --accent-text:    #ffffff;
    }

    [data-theme="light"] {
      --bg-body:        #f1f5f9;
      --bg-sidebar:     #ffffff;
      --bg-main:        #f8fafc;
      --bg-card:        #ffffff;
      --bg-elevated:    #f1f5f9;
      --bg-header:      #f8fafc;
      --bg-hover:       #f1f5f9;

      --border:         #e2e8f0;
      --border-soft:    #e2e8f0;
      --border-row:     #f1f5f9;

      --text-primary:   #0f172a;
      --text-secondary: #334155;
      --text-muted:     #64748b;
      --text-dim:       #475569;

      --accent:         #ef4444;
      --accent-hover:   #dc2626;
      --accent-text:    #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background: var(--bg-body);
      display: flex;
      height: 100vh;
      color: var(--text-primary);
      overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* SIDEBAR */
    .sidebar {
  width: 240px;
  background: #232c36;
  padding: 30px 20px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #333333;
  height: 100vh;
  position: sticky;
  top: 0;
  transition: width 0.25s ease, padding 0.25s ease;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  margin: 0 -8px;               /* negative so scrollbar doesn't clip buttons */
  padding: 0 8px;
}

.sidebar-nav::-webkit-scrollbar { width: 5px; }
.sidebar-nav::-webkit-scrollbar-track { background: transparent; }
.sidebar-nav::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
}
.sidebar-nav::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.3);
}

/* Brand block */
.sidebar-brand {
  text-align: center;
  padding-bottom: 22px;
  margin-bottom: 22px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.3);
  flex-shrink: 0;
}

.brand-logo-wrap {
  background: #ffffff;
  border-radius: 12px;
  padding: 8px;
  margin-bottom: 14px;
  border: 1px solid transparent;
  display: inline-block;
  width: 100%;
  box-sizing: border-box;
}

.brand-logo {
  display: block;
  width: 100%;
  max-width: 160px;
  height: auto;
  margin: 0 auto;
}

.brand-divider {
  width: 50px;
  height: 2px;
  background: #ffffff;
  margin: 10px auto 12px;
  border-radius: 1px;
  opacity: 0.6;
}

.brand-dept {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2.5px;
  color: #ffffff;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.brand-tagline {
  font-size: 9px;
  color: #ffffff;
  letter-spacing: 0.6px;
  line-height: 1.5;
  text-transform: uppercase;
  font-weight: 500;
}

/* Nav buttons */
.side-btn {
  width: 100%;
  padding: 12px 16px;
  background: transparent;
  border: none;
  border-radius: 10px;
  color: #ffffff;
  font-size: 15px;
  font-weight: 500;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: 0.2s ease;
  margin-bottom: 4px;
  font-family: inherit;
  position: relative;
}

/* Hover = red with 40% opacity */
.side-btn:hover {
  background: rgba(121, 121, 121, 0.4);
  color: #ffffff;
}

/* Active button */
.side-btn.active {
  background: #ffffff;
  color: #000000;
  font-weight: 700;
}

.side-btn.active:hover {
  background: #ffffff;
  color: #000000;
}

/* Icons */
.side-btn svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  stroke-width: 1.8;
  color: inherit;
  stroke: currentColor;
}

/* Logout button */
.logout-btn {
  margin-top: auto;
  border-top: 1px solid rgba(255,255,255,0.15);
  padding-top: 16px;
  color: #ffffff;
}

.logout-btn:hover {
  background: rgba(220, 38, 38, 0.4);
  color: #ffffff;
}

    /* Collapsed state overrides */
    .sidebar.collapsed {
      width: 70px;
      padding: 30px 10px;
    }
    .sidebar.collapsed .brand-dept,
    .sidebar.collapsed .brand-tagline,
    .sidebar.collapsed .brand-divider {
      display: none;
    }
    .sidebar.collapsed .sidebar-brand {
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .sidebar.collapsed .brand-logo-wrap {
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 0;
    }
    .sidebar.collapsed .brand-logo {
      max-width: 44px;
    }

    /* MAIN */
    .main { flex: 1; padding: 20px 24px; overflow: hidden; background: var(--bg-main); display: flex; flex-direction: column; min-height: 0; }
    .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-shrink: 0; }
    .main-header h1 { font-size: 24px; font-weight: 300; letter-spacing: 1px; color: var(--text-primary); }
    .main-header .header-right { display: flex; align-items: center; gap: 14px; }
    .main-header .user-badge { background: var(--bg-elevated); padding: 8px 18px; border-radius: 30px; font-size: 14px; color: var(--text-dim); border: 1px solid var(--border); display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
    .main-header .user-badge span { color: inherit; }
    .main-header .user-badge .role-tag { color: var(--text-primary); border-radius: 12px; font-size: 13.5px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

    /* LAYOUT: two-pane */
    .mail-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }

    /* ---------- LEFT: THREAD LIST ---------- */
    .threads-pane {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .threads-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg-header);
      flex-shrink: 0;
    }
    .threads-header h3 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .threads-header h3 .badge {
      background: var(--accent);
      color: #fff;
      padding: 2px 9px;
      border-radius: 10px;
      font-size: 10.5px;
    }
    .threads-header h3 .badge.hidden {
      display: none;
    }
    .threads-tools {
      display: flex;
      gap: 6px;
    }
    .threads-tools input {
      flex: 1;
      background: var(--bg-body);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      min-width: 0;
    }
    .threads-tools input:focus { outline: none; border-color: var(--accent); }
    .threads-tools button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .threads-tools button:hover { background: #1d4ed8; }
    .threads-tools button:disabled { opacity: 0.5; cursor: not-allowed; }
    .threads-tools .sync-btn { background: #16a34a; }
    .threads-tools .sync-btn:hover { background: #15803d; }
    .threads-tools .sync-btn.syncing { background: #6b7280; }

    .threads-list { flex: 1; overflow-y: auto; min-height: 0; }
    .threads-list::-webkit-scrollbar { width: 6px; }
    .threads-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .thread-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-row);
      cursor: pointer;
      transition: 0.15s;
      position: relative;
    }
    .thread-item:hover { background: var(--bg-hover); }
    .thread-item.active { background: var(--bg-elevated); border-left: 3px solid var(--accent); padding-left: 13px; }
    .thread-item.unread { background: rgba(239, 68, 68, 0.06); }
    .thread-item.unread:hover { background: rgba(239, 68, 68, 0.12); }

    .thread-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 4px;
    }
    .thread-req {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .thread-time {
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .thread-title {
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thread-vendor {
      color: var(--text-muted);
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thread-counts {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      font-size: 10px;
    }
    .thread-counts .pill {
      background: var(--bg-elevated);
      color: var(--text-dim);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .thread-counts .pill.unread-pill {
      background: #ef4444;
      color: #fff;
    }

    /* ---------- RED PULSING UNREAD DOT ---------- */
    .thread-unread-dot {
      position: absolute;
      top: 16px;
      right: 14px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
      animation: pulse-dot 1.6s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25); }
      50%      { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.08); }
    }

    .threads-empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      font-size: 12px;
      line-height: 1.7;
    }
    .threads-empty .big-icon { display: block; font-size: 32px; margin-bottom: 8px; opacity: 0.5; }

    /* ---------- RIGHT: THREAD DETAIL ---------- */
    .detail-pane {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .detail-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
      font-style: italic;
      line-height: 1.7;
    }
    .detail-empty .big-icon { font-size: 56px; margin-bottom: 14px; opacity: 0.4; }

    .detail-header {
      padding: 14px 20px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-soft);
      flex-shrink: 0;
    }
    .detail-header .dh-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .detail-header .dh-title {
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .detail-header .dh-title .req-tag {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .detail-header .dh-meta {
      color: var(--text-muted);
      font-size: 12px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .detail-header .dh-meta b { color: var(--text-secondary); font-weight: 600; }

    /* Conversation scroll area */
    .conversation {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: var(--bg-body);
      min-height: 0;
    }
    .conversation::-webkit-scrollbar { width: 8px; }
    .conversation::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .email-bubble {
      max-width: 78%;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 14px;
      position: relative;
    }
    .email-bubble.sent {
      margin-left: auto;
      background: rgba(37, 99, 235, 0.10);
      border-color: rgba(37, 99, 235, 0.35);
    }
    .email-bubble.received {
      margin-right: auto;
      background: var(--bg-card);
    }

    .email-bubble .eb-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--border-row);
      flex-wrap: wrap;
    }
    .email-bubble .eb-from {
      font-size: 11.5px;
      color: var(--text-primary);
      font-weight: 600;
    }
    .email-bubble .eb-from .arrow {
      color: var(--text-muted);
      font-weight: 400;
      margin: 0 4px;
    }
    .email-bubble .eb-date {
      font-size: 10.5px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .email-bubble .eb-subject {
      font-size: 12.5px;
      color: var(--text-primary);
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .email-bubble .eb-body {
      color: var(--text-secondary);
      font-size: 12.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .email-bubble .eb-atts {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-row);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .email-bubble .eb-atts a {
      background: var(--bg-elevated);
      color: var(--text-dim);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      transition: 0.2s;
    }
    .email-bubble .eb-atts a:hover { border-color: var(--accent); color: var(--accent); }

    .email-bubble .eb-tag {
      position: absolute;
      top: -8px;
      right: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 9px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .email-bubble.sent .eb-tag { background: #2563eb; color: #fff; border-color: #2563eb; }

    /* Compose area */
    .compose {
      background: var(--bg-card);
      border-top: 1px solid var(--border-soft);
      padding: 16px 20px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 55%;
      overflow-y: auto;
    }
    .compose::-webkit-scrollbar { width: 6px; }
    .compose::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .compose .cm-row {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 10px;
      align-items: center;
    }
    .compose .cm-row label {
      color: var(--text-muted);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .compose .cm-row input,
    .compose .cm-row textarea {
      background: var(--bg-body);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
    }
    .compose .cm-row textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.5;
    }
    .compose .cm-row input:focus,
    .compose .cm-row textarea:focus { outline: none; border-color: var(--accent); }

    .compose .cm-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 6px;
      flex-wrap: wrap;
    }
    .compose .cm-actions .attach-btn {
      background: var(--bg-elevated);
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .compose .cm-actions .attach-btn:hover { border-color: var(--accent); color: var(--accent); }
    .compose .cm-actions .attach-btn input[type=file] { display: none; }

    .compose .cm-actions .send-btn {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 8px 22px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .compose .cm-actions .send-btn:hover { background: #15803d; }
    .compose .cm-actions .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .compose .cm-actions .reset-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .compose .cm-actions .reset-btn:hover { color: var(--text-primary); border-color: var(--text-muted); }

    .attached-files {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .attached-files .att-chip {
      background: var(--bg-elevated);
      color: var(--text-dim);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .attached-files .att-chip button {
      background: none;
      border: none;
      color: #ef6b6b;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      padding: 0;
      line-height: 1;
      font-family: inherit;
    }

    /* ---------- TOAST ---------- */
    .toast {
      position: fixed;
      top: 30px;
      right: 30px;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-left: 4px solid #22c55e;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transform: translateX(400px);
      transition: 0.3s ease;
      z-index: 99999;
      max-width: 380px;
    }
    .toast.show { transform: translateX(0); }
    .toast.error { border-left-color: var(--accent); }

    /* ---------- MOBILE ---------- */
    @media (max-width: 1100px) {
      .mail-layout { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    }

    @media (max-width: 768px) {
      .sidebar { width: 70px; padding: 20px 10px; }
      .sidebar .logo, .sidebar .logo-sub, .sidebar .side-btn span { display: none; }
      .main { padding: 14px; }
      .main-header h1 { font-size: 18px; }
      .compose .cm-row { grid-template-columns: 1fr; }
      .compose .cm-row label { margin-bottom: -6px; }
      .email-bubble { max-width: 100%; }
    }
  </style>
<link rel="stylesheet" href="/mobile.css">
</head>
<body> 

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="sidebar-brand">
      <div class="brand-logo-wrap">
        <img src="img/logo.png" alt="Examedia" class="brand-logo" />
      </div>
      <div class="brand-divider"></div>
      <div class="brand-dept">TSD WMS</div>
      <div class="brand-tagline">Technical Support Department</div>
      <div class="brand-tagline">Warehouse Management System</div>
    </div>

    <!-- NAVIGATION -->
     <div class="sidebar-nav">
    <button class="side-btn" onclick="location.href='/dashboard.html'"><i data-lucide="layout-dashboard"></i> <span>Dashboard</span></button>

  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="main-header">
      <h1 style="font-weight: bold;">Vendor Emails</h1>

      <div class="header-right">
        <div id="notificationBell"></div>

        <div class="user-badge">
          👤 Welcome, <span id="userName">…</span>
          <span class="role-tag" id="userRole"></span>
        </div>
      </div>
    </div>

    <!-- MAIL LAYOUT -->
    <div class="mail-layout">

      <!-- LEFT: threads -->
      <aside class="threads-pane">
        <div class="threads-header">
          <h3>
            <span>Threads</span>
            <span class="badge hidden" id="threadCount">0</span>
          </h3>
          <div class="threads-tools">
            <input type="text" id="threadSearch" placeholder="Search request / vendor…" oninput="filterThreads()" />
            <button class="sync-btn" id="btnSync" onclick="syncInbox()">🔄 Sync</button>
          </div>
        </div>

        <div class="threads-list" id="threadsList">
          <div class="threads-empty">
            <span class="big-icon">📭</span>
            Loading…
          </div>
        </div>
      </aside>

      <!-- RIGHT: detail + compose -->
      <section class="detail-pane" id="detailPane">
        <div class="detail-empty">
          <span class="big-icon">✉️</span>
          Select a request from the left<br>
          to view and reply to its vendor conversation.
        </div>
      </section>

    </div>

  </div>

  <script src="/notifications.js"></script>
  <script src="/logout.js"></script>
  <script src="/escape.js"></script> 
  <script>
    // ---------- STATE ----------
    let currentUser = null;
    let threads = [];
    let activeRequestId = null;
    let activeRequest = null;
    let activeEmails = [];
    let pendingFiles = [];
    let autoSyncTimer = null;

    const AUTO_SYNC_MS = 60000;

    // ---------- AUTH ----------
    async function checkAuth() {
      try {
        const res = await fetch('/api/me', { credentials: 'include' });
        const data = await res.json();
        if (!data.user) { window.location.href = '/login.html'; return null; }

        currentUser = data.user;

        // Only admin + finance allowed on this page
        if (!['admin', 'finance'].includes(currentUser.role)) {
          alert('🔒 Only admin and finance can access the Emails page.');
          window.location.href = '/dashboard.html';
          return null;
        }

        document.getElementById('userName').textContent =
          currentUser.full_name || currentUser.username || 'User';
        const roleEl = document.getElementById('userRole');
        roleEl.textContent = currentUser.role;
        roleEl.className = 'role-tag ' + currentUser.role;

        return currentUser;
      } catch (e) {
        window.location.href = '/login.html';
        return null;
      }
    }

    // ---------- LOAD THREADS ----------
    async function loadThreads(keepActive = true) {
      try {
        const res = await fetch('/api/emails/threads', { credentials: 'include' });
        if (!res.ok) throw new Error('Failed to load threads');
        threads = await res.json();
        renderThreads();

        if (!keepActive && !activeRequestId) {
          const params = new URLSearchParams(location.search);
          const rid = params.get('request_id');
          if (rid) openThread(parseInt(rid, 10));
        }
      } catch (e) {
        document.getElementById('threadsList').innerHTML =
          `<div class="threads-empty"><span class="big-icon">⚠️</span>Failed to load threads.<br>${escapeHtml(e.message)}</div>`;
      }
    }

    function filterThreads() {
      renderThreads();
    }

    // ---------- RENDER THREADS ----------
    function renderThreads() {
      const list = document.getElementById('threadsList');
      const badge = document.getElementById('threadCount');
      const q = (document.getElementById('threadSearch').value || '').toLowerCase().trim();

      let filtered = threads;
      if (q) {
        filtered = threads.filter(t =>
          String(t.request_id).includes(q) ||
          (t.part || '').toLowerCase().includes(q) ||
          (t.vendor_name || '').toLowerCase().includes(q) ||
          (t.vendor_email || '').toLowerCase().includes(q)
        );
      }

      // ⭐ Header badge now shows TOTAL UNREAD across all threads
      const totalUnread = threads.reduce((sum, t) => sum + (t.unread_count || 0), 0);
      if (totalUnread > 0) {
        badge.textContent = totalUnread;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      if (filtered.length === 0) {
        list.innerHTML = `<div class="threads-empty"><span class="big-icon">📭</span>No external requests found.</div>`;
        return;
      }

      list.innerHTML = filtered.map(t => {
        const unread = t.unread_count > 0;
        const isActive = (t.request_id === activeRequestId);

        const sentCount = t.sent_count || 0;
        const recvCount = t.received_count || 0;
        const lastAct = t.last_activity ? timeAgo(t.last_activity) : '—';

        return `
          <div class="thread-item ${isActive ? 'active' : ''} ${unread ? 'unread' : ''}"
               onclick="openThread(${t.request_id})">
            <div class="thread-top">
              <span class="thread-req">REQ #${t.request_id}</span>
              <span class="thread-time">${lastAct}</span>
            </div>
            <div class="thread-title">${escapeHtml(t.category || '—')} — ${escapeHtml(t.part || '—')}</div>
            <div class="thread-vendor">🏭 ${escapeHtml(t.vendor_name || 'Vendor')}</div>
            <div class="thread-counts">
              <span class="pill">📤 ${sentCount}</span>
              <span class="pill">📥 ${recvCount}</span>
              ${unread ? `<span class="pill unread-pill">${t.unread_count} new</span>` : ''}
            </div>
            ${unread ? '<span class="thread-unread-dot"></span>' : ''}
          </div>`;
      }).join('');
    }

    // ---------- OPEN A THREAD ----------
    async function openThread(requestId) {
      activeRequestId = requestId;
      renderThreads();

      const pane = document.getElementById('detailPane');
      pane.innerHTML = `
        <div class="detail-empty">
          <span class="big-icon">⏳</span>
          Loading conversation…
        </div>`;

      try {
        const res = await fetch(`/api/emails/thread/${requestId}`, { credentials: 'include' });
        if (!res.ok) throw new Error('Failed to load thread');
        const data = await res.json();
        activeRequest = data.request;
        activeEmails = data.emails || [];

        renderDetail();

        // Mark unread as read
        const unread = activeEmails.filter(e => e.direction === 'received' && !e.is_read);
        for (const u of unread) {
          await fetch(`/api/emails/${u.email_id}/read`, { method: 'PATCH', credentials: 'include' });
        }
        if (unread.length > 0) {
          // ⭐ Refresh local thread list AND sidebar badge instantly
          await loadThreads(true);
          if (typeof window.__refreshEmailBadge === 'function') {
            window.__refreshEmailBadge();
          }
        }
      } catch (e) {
        pane.innerHTML = `
          <div class="detail-empty">
            <span class="big-icon">⚠️</span>
            Could not load thread.<br>${escapeHtml(e.message)}
          </div>`;
      }
    }

    // ---------- RENDER DETAIL (conversation + compose) ----------
    function renderDetail() {
      if (!activeRequest) return;
      const pane = document.getElementById('detailPane');

      const r = activeRequest;
      const vendorEmail = r.vendor_email || '';
      const vendorContact = r.vendor_contact || r.vendor_name || 'Sir/Madam';
      const subject = `[REQ-${r.request_id}] Request for Quotation — ${r.part || 'item'}`;
      const bodyTemplate = buildRfqTemplate(r, vendorContact);

      pane.innerHTML = `
        <div class="detail-header">
          <div class="dh-top">
            <div class="dh-title">
              <span class="req-tag">REQ #${r.request_id}</span>
              ${escapeHtml(r.category || '—')} — ${escapeHtml(r.part || '—')}
            </div>
          </div>
          <div class="dh-meta">
            <span>🏭 <b>${escapeHtml(r.vendor_name || '—')}</b></span>
            <span>✉️ <b>${escapeHtml(vendorEmail || '—')}</b></span>
            <span>👤 Requested by <b>${escapeHtml(r.requester_name || '—')}</b></span>
            <span>📊 Qty <b>${r.qty || '—'}</b></span>
            <span>📍 <b>${escapeHtml(r.client || '—')}</b></span>
          </div>
        </div>

        <div class="conversation" id="conversation">
          ${renderConversation(activeEmails)}
        </div>

        <div class="compose">
          <div class="cm-row">
            <label>To</label>
            <input type="email" id="cmTo" value="${escapeHtml(vendorEmail)}" />
          </div>
          <div class="cm-row">
            <label>Subject</label>
            <input type="text" id="cmSubject" value="${escapeHtml(subject)}" />
          </div>
          <div class="cm-row">
            <label>Body</label>
            <textarea id="cmBody">${escapeHtml(bodyTemplate)}</textarea>
          </div>
          <div id="cmAttached" class="attached-files"></div>
          <div class="cm-actions">
            <label class="attach-btn">
              📎 Attach Files
              <input type="file" id="cmFiles" multiple onchange="handleFiles(event)" />
            </label>
            <button class="reset-btn" onclick="resetTemplate()">↺ Reset Body</button>
            <button class="send-btn" id="cmSend" onclick="sendEmail()">✉️ Send</button>
          </div>
        </div>
      `;

      setTimeout(() => {
        const c = document.getElementById('conversation');
        if (c) c.scrollTop = c.scrollHeight;
      }, 40);
    }

    function renderConversation(emails) {
      if (!emails || emails.length === 0) {
        return `<div style="text-align:center;padding:40px 20px;color:var(--text-muted);font-style:italic;font-size:12px;">
          No emails yet. Send the first one below.
        </div>`;
      }

      return emails.map(e => {
        const dir = e.direction;
        const when = formatDate(e.created_at);
        const atts = (e.attachments || []);
        const attHtml = atts.length
          ? `<div class="eb-atts">${atts.map(a =>
              `<a href="${escapeHtml(a.stored)}" target="_blank">📎 ${escapeHtml(a.filename || 'attachment')}</a>`
            ).join('')}</div>`
          : '';

        const toList = (e.to_email || '').split(',').map(x => x.trim()).filter(Boolean).join(', ');
        const fromShort = shortEmail(e.from_email);

        return `
          <div class="email-bubble ${dir}">
            <span class="eb-tag">${dir === 'sent' ? 'Sent' : 'Received'}</span>
            <div class="eb-head">
              <div class="eb-from">${escapeHtml(fromShort)}<span class="arrow">→</span>${escapeHtml(toList)}</div>
              <div class="eb-date">${when}</div>
            </div>
            <div class="eb-subject">${escapeHtml(e.subject || '(no subject)')}</div>
            <div class="eb-body">${escapeHtml(e.body_full || e.body_preview || '')}</div>
            ${attHtml}
          </div>`;
      }).join('');
    }

    // ---------- BUILD TEMPLATE ----------
    function buildRfqTemplate(r, contact) {
      const lines = [
        `Dear ${contact},`,
        ``,
        `We would like to request a quotation for the following item:`,
        ``,
        `  Request No.  : #${r.request_id}`,
        `  Part Number  : ${r.part || '—'}`,
        `  Description  : ${r.description || '—'}`,
        `  Category     : ${r.category || '—'}`,
        `  Quantity     : ${r.qty || '—'}`,
        `  Client/Site  : ${r.client || '—'}`,
        `  Required By  : ${r.required_date ? new Date(r.required_date).toLocaleDateString('en-GB') : '—'}`,
        ``,
        `Please provide your best price, delivery estimate, and quotation validity period.`,
        ``,
        `— Write your message above this line —`,
        ``,
        `Thank you,`,
        `TSD Procurement`
      ];
      return lines.join('\n');
    }

    function resetTemplate() {
      if (!activeRequest) return;
      const contact = activeRequest.vendor_contact || activeRequest.vendor_name || 'Sir/Madam';
      document.getElementById('cmBody').value = buildRfqTemplate(activeRequest, contact);
    }

    // ---------- FILES ----------
    function handleFiles(e) {
      const files = Array.from(e.target.files || []);
      for (const f of files) {
        if (pendingFiles.length >= 5) { alert('Maximum 5 attachments.'); break; }
        if (f.size > 15 * 1024 * 1024) { alert(`"${f.name}" is too large (max 15 MB).`); continue; }
        pendingFiles.push(f);
      }
      renderAttachedFiles();
      e.target.value = '';
    }

    function renderAttachedFiles() {
      const box = document.getElementById('cmAttached');
      if (!box) return;
      box.innerHTML = pendingFiles.map((f, i) => `
        <span class="att-chip">📎 ${escapeHtml(f.name)} <button onclick="removeFile(${i})">✕</button></span>
      `).join('');
    }

    function removeFile(idx) {
      pendingFiles.splice(idx, 1);
      renderAttachedFiles();
    }

    // ---------- SEND ----------
    async function sendEmail() {
      if (!activeRequestId) return;

      const to = document.getElementById('cmTo').value.trim();
      const subject = document.getElementById('cmSubject').value.trim();
      const body = document.getElementById('cmBody').value;

      if (!to) { showToast('⚠️ Recipient email is required.', true); return; }
      if (!subject) { showToast('⚠️ Subject is required.', true); return; }
      if (!body.trim()) { showToast('⚠️ Body is required.', true); return; }

      const btn = document.getElementById('cmSend');
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = '⏳ Sending…';

      try {
        const fd = new FormData();
        fd.append('request_id', activeRequestId);
        fd.append('to', to);
        fd.append('subject', subject);
        fd.append('body', body);
        pendingFiles.forEach(f => fd.append('attachments', f));

        const res = await fetch('/api/emails/send', {
          method: 'POST',
          credentials: 'include',
          body: fd
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to send');

        showToast(`✅ Email sent to ${to}`);
        pendingFiles = [];
        renderAttachedFiles();

        await openThread(activeRequestId);
        await loadThreads(true);
      } catch (e) {
        showToast('❌ ' + e.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    // ---------- SYNC ----------
    async function syncInbox() {
      const btn = document.getElementById('btnSync');
      btn.disabled = true;
      btn.classList.add('syncing');
      const original = btn.textContent;
      btn.textContent = '⏳ Syncing…';

      try {
        const res = await fetch('/api/emails/sync', {
          method: 'POST',
          credentials: 'include'
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to sync');

        if (data.skipped) {
          showToast(`⏱ ${data.reason} — try again in a moment.`);
        } else if (data.errors && data.errors.length) {
          showToast(`⚠️ Sync had errors: ${data.errors[0]}`, true);
        } else {
          showToast(`📥 Fetched ${data.fetched} new · matched ${data.matched}`);
        }

        await loadThreads(true);
        // ⭐ Also refresh sidebar badge
        if (typeof window.__refreshEmailBadge === 'function') {
          window.__refreshEmailBadge();
        }
        if (activeRequestId) openThread(activeRequestId);
      } catch (e) {
        showToast('❌ Sync failed: ' + e.message, true);
      } finally {
        btn.disabled = false;
        btn.classList.remove('syncing');
        btn.textContent = original;
      }
    }

    // ---------- HELPERS ----------
    function formatDate(ts) {
      const d = new Date(ts);
      if (isNaN(d)) return '—';
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' +
             d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    function timeAgo(ts) {
      const now = new Date();
      const d = new Date(ts);
      const diff = Math.floor((now - d) / 1000);
      if (diff < 60) return 'now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h';
      if (diff < 604800) return Math.floor(diff / 86400) + 'd';
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function shortEmail(e) {
      if (!e) return '—';
      const at = e.indexOf('@');
      return at > 0 ? e.slice(0, at) : e;
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    let toastTimer = null;
    function showToast(msg, isError) {
      let t = document.getElementById('toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'toast';
        t.className = 'toast';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.classList.toggle('error', !!isError);
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
    }

    // ---------- PAGE LOAD ----------
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      if (!currentUser) return;

      await loadThreads(false);

      const params = new URLSearchParams(location.search);
      const rid = params.get('request_id');
      if (rid) openThread(parseInt(rid, 10));

      autoSyncTimer = setInterval(() => {
        fetch('/api/emails/sync', { method: 'POST', credentials: 'include' })
          .then(r => r.json())
          .then(d => {
            if (!d.skipped && !d.errors?.length) {
              loadThreads(true);
              if (typeof window.__refreshEmailBadge === 'function') {
                window.__refreshEmailBadge();
              }
            }
          })
          .catch(() => {});
      }, AUTO_SYNC_MS);
    });
  </script>
  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>
