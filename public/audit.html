  <style>
    /* ---------- THEME VARIABLES ---------- */
    :root,
    [data-theme="dark"] {
      --bg-body:        #0b0e14;
      --bg-sidebar:     #141a24;
      --bg-main:        #0f131a;
      --bg-card:        #181f2b;
      --bg-elevated:    #1f2a3a;
      --bg-header:      #111820;
      --bg-hover:       #1a2332;

      --border:         #2a3344;
      --border-soft:    #252f3f;
      --border-row:     #1f2a3a;

      --text-primary:   #e2e8f0;
      --text-secondary: #cbd5e0;
      --text-muted:     #7a8ba3;
      --text-dim:       #a0b3cc;

      --accent:         #ef4444;
      --accent-hover:   #dc2626;
      --accent-text:    #ffffff;
    }

    [data-theme="light"] {
      --bg-body:        #f1f5f9;
      --bg-sidebar:     #ffffff;
      --bg-main:        #f8fafc;
      --bg-card:        #ffffff;
      --bg-elevated:    #f1f5f9;
      --bg-header:      #f8fafc;
      --bg-hover:       #f1f5f9;

      --border:         #e2e8f0;
      --border-soft:    #e2e8f0;
      --border-row:     #f1f5f9;

      --text-primary:   #0f172a;
      --text-secondary: #334155;
      --text-muted:     #64748b;
      --text-dim:       #475569;

      --accent:         #ef4444;
      --accent-hover:   #dc2626;
      --accent-text:    #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background: var(--bg-body);
      display: flex;
      height: 100vh;
      color: var(--text-primary);
      overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* SIDEBAR */
     .sidebar {
      width: 240px;
      background: #dc2626;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #b91c1c;
      height: 100vh;
      position: sticky;
      top: 0;
      transition: width 0.25s ease, padding 0.25s ease;
    }

    /* Brand block */
    .sidebar-brand {
      text-align: center;
      padding-bottom: 22px;
      margin-bottom: 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.788);
      flex-shrink: 0;
    }

    .brand-logo-wrap {
      background: #ffffff;
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 14px;
      border: 1px solid transparent;
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
    }

    .brand-logo {
      display: block;
      width: 100%;
      max-width: 160px;
      height: auto;
      margin: 0 auto;
    }

    .brand-divider {
      width: 50px;
      height: 2px;
      background: #ffffff;
      margin: 10px auto 12px;
      border-radius: 1px;
      opacity: 0.6;
    }

    .brand-dept {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .brand-tagline {
      font-size: 9px;
      color: rgb(255, 255, 255);
      letter-spacing: 0.6px;
      line-height: 1.5;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Nav buttons */
    .sidebar {
  width: 240px;
  background: #232c36;
  padding: 30px 20px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #333333;
  height: 100vh;

}

.sidebar-nav {
  flex: 1;

  padding: 0 8px;
}

.sidebar-nav::-webkit-scrollbar { width: 5px; }
.sidebar-nav::-webkit-scrollbar-track { background: transparent; }
.sidebar-nav::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
}
.sidebar-nav::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.3);
}

/* Brand block */
.sidebar-brand {
  text-align: center;
  padding-bottom: 22px;
  margin-bottom: 22px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.3);
  flex-shrink: 0;
}

.brand-logo-wrap {
  background: #ffffff;
  border-radius: 12px;
  padding: 8px;
  margin-bottom: 14px;
  border: 1px solid transparent;
  display: inline-block;
  width: 100%;
  box-sizing: border-box;
}

.brand-logo {
  display: block;
  width: 100%;
  max-width: 160px;
  height: auto;
  margin: 0 auto;
}

.brand-divider {
  width: 50px;
  height: 2px;
  background: #ffffff;
  margin: 10px auto 12px;
  border-radius: 1px;
  opacity: 0.6;
}

.brand-dept {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2.5px;
  color: #ffffff;
  text-transform: uppercase;

}

.brand-tagline {

  letter-spacing: 0.6px;

}

/* Nav buttons */
.side-btn {
  width: 100%;
  padding: 12px 16px;
  background: transparent;
  border: none;
  border-radius: 10px;
  color: #ffffff;
  font-size: 15px;
  font-weight: 500;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: 0.2s ease;
  margin-bottom: 4px;
  font-family: inherit;
  position: relative;
}

/* Hover = red with 40% opacity */
.side-btn:hover {
  background: rgba(121, 121, 121, 0.4);
  color: #ffffff;
}

/* Active button */
.side-btn.active {
  background: #ffffff;
  color: #000000;
  font-weight: 700;
}

.side-btn.active:hover {
  background: #ffffff;
  color: #000000;
}

/* Icons */
.side-btn svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  stroke-width: 1.8;
  color: inherit;
  stroke: currentColor;
}

/* Logout button */
.logout-btn {
  margin-top: auto;
  border-top: 1px solid rgba(255,255,255,0.15);
  padding-top: 16px;
  color: #ffffff;
}

.logout-btn:hover {
  background: rgba(220, 38, 38, 0.4);
  color: #ffffff;
}

    /* Collapsed state overrides */
    .sidebar.collapsed {
      width: 70px;
      padding: 30px 10px;
    }
    .sidebar.collapsed .brand-dept,
    .sidebar.collapsed .brand-tagline,
    .sidebar.collapsed .brand-divider {
      display: none;
    }
    .sidebar.collapsed .sidebar-brand {
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .sidebar.collapsed .brand-logo-wrap {
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 0;
    }
    .sidebar.collapsed .brand-logo {
      max-width: 44px;
    }

    /* MAIN */
    .main { flex: 1; padding: 30px 40px; overflow-y: auto; background: var(--bg-main); display: flex; flex-direction: column; }
    .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .main-header h1 { font-size: 26px; font-weight: 300; letter-spacing: 1px; color: var(--text-primary); }
    .main-header .header-right { display: flex; align-items: center; gap: 14px; }
    .main-header .user-badge { background: var(--bg-elevated); padding: 8px 18px; border-radius: 30px; font-size: 14px; color: var(--text-dim); border: 1px solid var(--border); display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
    .main-header .user-badge span { color: inherit; }
    .main-header .user-badge .role-tag { color: var(--text-primary); border-radius: 12px; font-size: 13.5px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

    /* STATS */
    .stats-overview { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
    .stat-item { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 12px; padding: 12px 25px; flex: 1 0 auto; min-width: 130px; text-align: center; transition: 0.2s; }
    .stat-item .stat-value { font-size: 26px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
    .stat-item .stat-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-top: 2px; }

    /* FILTERS */
    .filters {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .filters .filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1 1 160px; min-width: 140px; }
    .filters label { color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .filters input,
    .filters select {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
    }
    .filters input:focus,
    .filters select:focus { outline: none; border-color: var(--accent); }

    .filters .filter-actions { display: flex; gap: 8px; align-items: center; }
    .btn-apply {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .btn-apply:hover { background: var(--accent-hover); }
    .btn-reset {
      background: var(--bg-elevated);
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .btn-reset:hover { background: var(--border); color: var(--text-primary); }

    /* TABLE */
    .table-wrapper { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-soft); overflow: hidden; display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .table-scroll { overflow-y: auto; flex: 1; min-height: 0; }
    .table-scroll::-webkit-scrollbar { width: 8px; }
    .table-scroll::-webkit-scrollbar-track { background: var(--bg-header); }
    .table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .table-scroll::-webkit-scrollbar-thumb:hover { background: var(--border); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1100px; }
    th { text-align: left; padding: 14px 14px; background: var(--bg-header); color: var(--text-muted); text-transform: uppercase; font-size: 11px; letter-spacing: 1px; border-bottom: 2px solid var(--border-soft); position: sticky; top: 0; z-index: 10; white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid var(--border-row); color: var(--text-secondary); vertical-align: top; }
    tr:hover td { background: var(--bg-hover); }
    .empty-row td { text-align: center; padding: 40px 16px; color: var(--text-muted); font-style: italic; font-size: 15px; }

    /* ---------- ACTION BADGES ---------- */
    .action-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      white-space: nowrap;
      background: #2a3344;
      color: #ffffff;
    }

    /* ---------- PER-ACTION COLORS ---------- */
    /* Inventory */
    .action-badge.added            { background: #41d265; color: #ffffff; }  /* green */
    .action-badge.taken_out        { background: #917935; color: #ffffff; }  /* orange */
    .action-badge.assigned         { background: #917935; color: #ffffff; }  /* blue */

    /* Requests */
    .action-badge.created          { background: #917935; color: #ffffff; }  /* blue */
    .action-badge.approved         { background: #41d265; color: #ffffff; }  /* green */
    .action-badge.rejected         { background: #ce3d3d; color: #ffffff; }  /* red */
    .action-badge.quotation_approved { background: #41d265; color: #ffffff; }
    .action-badge.quotation_rejected { background: #ce3d3d; color: #ffffff; }
    .action-badge.completed        { background: #41d265; color: #ffffff; }  /* deep green */
    .action-badge.status_changed   { background: #917935; color: #ffffff; }  /* gray fallback */

    /* Quotation */
    .action-badge.uploaded         { background: #917935; color: #ffffff; }  /* purple */

    /* Purchase Orders */
    .action-badge.purchased        { background: #41d265; color: #ffffff; }  /* cyan */
    .action-badge.received         { background: #41d265; color: #ffffff; }  /* teal */

    /* Loans */
    .action-badge.returned         { background: #41d265; color: #ffffff; }  /* slate */
    .action-badge.paid             { background: #41d265; color: #ffffff; }  /* gold w/ dark text */

    /* Status-based colors (applied when action = request.status_changed) */
    .action-badge.pending          { background: #917935; color: #ffffff; }
    .action-badge.pending_purchase { background: #917935; color: #ffffff; }
    .action-badge.pending_manager_approval { background: #917935; color: #ffffff; }
    .action-badge.ordered          { background: #41d265; color: #ffffff; }
    .action-badge.delivered        { background: #41d265; color: #ffffff; }
    .action-badge.shipped          { background: #41d265; color: #ffffff; }

    /* STATUS FLOW */
    .flow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .flow .from, .flow .to {
      padding: 2px 10px;
      border-radius: 20px;
      background: var(--bg-elevated);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .flow .from { color: var(--text-muted); }
    .flow .to   { color: var(--accent); }
    .flow .arrow { color: var(--text-dim); font-weight: 700; }

    /* NOTES */
    .notes {
      color: var(--text-dim);
      font-size: 12px;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* TIME */
    .time-cell { white-space: nowrap; font-size: 12px; color: var(--text-muted); }
    .time-cell .date { color: var(--text-secondary); font-weight: 600; display: block; }
    .time-cell .clock { font-size: 11px; }

    /* MOBILE */
    @media (max-width: 768px) {
      .sidebar { width: 70px; padding: 20px 10px; }
      .sidebar .logo, .sidebar .logo-sub, .sidebar .side-btn span { display: none; }
      .main { padding: 20px; }
      .stats-overview .stat-item { flex: 1 1 40%; }
      .filters { flex-direction: column; align-items: stretch; }
      .filters .filter-group { flex: 1 1 auto; }
      .filters .filter-actions { justify-content: stretch; }
      .filters .filter-actions button { flex: 1; }
    }
</style>

  <script>
    // ---------- STATE ----------
    let currentUser = null;
    let allEntries = [];

    // ---------- AUTH ----------
    async function checkAuth() {
      try {
        const res = await fetch('/api/me', { credentials: 'include' });
        const data = await res.json();
        if (!data.user) { window.location.href = '/login.html'; return null; }

        currentUser = data.user;

        document.getElementById('userName').textContent =
          currentUser.full_name || currentUser.username;
        const roleEl = document.getElementById('userRole');
        roleEl.textContent = currentUser.role;
        roleEl.className = 'role-tag ' + currentUser.role;

        return currentUser;
      } catch (e) {
        window.location.href = '/login.html';
        return null;
      }
    }

    // ---------- LOAD AUDIT ----------
    async function loadAudit() {
      const tbody = document.getElementById('auditBody');
      tbody.innerHTML = `<tr class="empty-row"><td colspan="8">⏳ Loading audit log…</td></tr>`;

      try {
        const res = await fetch('/api/audit?limit=500', { credentials: 'include' });
        if (res.status === 403) {
          tbody.innerHTML = `<tr class="empty-row"><td colspan="8">🔒 You don't have permission to view the audit log.</td></tr>`;
          return;
        }
        if (!res.ok) throw new Error('Failed to load');

        allEntries = await res.json();
        renderTable(allEntries);
        updateStats(allEntries);
      } catch (e) {
        console.error(e);
        tbody.innerHTML = `<tr class="empty-row"><td colspan="8">❌ Error loading audit log.</td></tr>`;
      }
    }

    // ---------- LOAD ACTION FILTER OPTIONS ----------
    async function loadActionOptions() {
      try {
        const res = await fetch('/api/audit/actions', { credentials: 'include' });
        if (!res.ok) return;
        const actions = await res.json();
        const select = document.getElementById('fAction');
        select.innerHTML = '<option value="">All</option>' +
          actions.map(a => `<option value="${a}">${a}</option>`).join('');
      } catch (e) {
        console.error('Error loading actions:', e);
      }
    }

    // ---------- RENDER ----------
    function renderTable(entries) {
      const tbody = document.getElementById('auditBody');

      if (!entries || entries.length === 0) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="8">📭 No audit events found.</td></tr>`;
        return;
      }

      tbody.innerHTML = entries.map(e => {
        const when = formatTime(e.created_at);
        const actionShort = prettyAction(e.action, e.to_status);
        const colorKey = actionClass(e.action, e.to_status);

        const flow = (e.from_status || e.to_status)
          ? `<span class="flow">
               ${e.from_status ? `<span class="from">${e.from_status.replace(/_/g,' ')}</span>` : ''}
               ${e.from_status && e.to_status ? '<span class="arrow">→</span>' : ''}
               ${e.to_status ? `<span class="to">${e.to_status.replace(/_/g,' ')}</span>` : ''}
             </span>`
          : '—';

        return `
          <tr>
            <td class="time-cell">
              <span class="date">${when.date}</span>
              <span class="clock">${when.time}</span>
            </td>
            <td>
              <div style="font-weight:600; color:var(--text-primary);">${escapeHtml(e.user_name || '—')}</div>
              <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">${escapeHtml(e.user_role || '')}</div>
            </td>
            <td>
              <span class="action-badge ${colorKey}">${escapeHtml(actionShort)}</span>
            </td>
            <td>${escapeHtml(e.item_part || '—')}${e.item_client ? `<div style="font-size:11px; color:var(--text-muted);">${escapeHtml(e.item_client)}</div>` : ''}</td>
            <td>${escapeHtml(e.item_serial || '—')}</td>
            <td>${e.qty ?? '—'}</td>
            <td>${flow}</td>
            <td><div class="notes" title="${escapeHtml(e.notes || '')}">${escapeHtml(e.notes || '—')}</div></td>
          </tr>
        `;
      }).join('');
    }

    // ---------- STATS ----------
    function updateStats(entries) {
      const total = entries.length;

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const todayCount = entries.filter(e => new Date(e.created_at) >= today).length;

      const invCount = entries.filter(e => e.entity_type === 'inventory').length;
      const reqCount = entries.filter(e => e.entity_type === 'request').length;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-today').textContent = todayCount;
      document.getElementById('stat-inventory').textContent = invCount;
      document.getElementById('stat-requests').textContent = reqCount;
    }

    // ---------- FILTERS ----------
    function applyFilters() {
      const search = document.getElementById('fSearch').value.toLowerCase().trim();
      const entity = document.getElementById('fEntity').value;
      const action = document.getElementById('fAction').value;
      const from = document.getElementById('fFrom').value;
      const to = document.getElementById('fTo').value;

      let result = allEntries;

      if (entity) result = result.filter(e => e.entity_type === entity);
      if (action) result = result.filter(e => e.action === action);

      if (from) {
        const f = new Date(from + 'T00:00:00');
        result = result.filter(e => new Date(e.created_at) >= f);
      }
      if (to) {
        const t = new Date(to + 'T23:59:59');
        result = result.filter(e => new Date(e.created_at) <= t);
      }

      if (search) {
        result = result.filter(e => {
          const s = `${e.user_name || ''} ${e.item_part || ''} ${e.item_serial || ''} ${e.item_client || ''} ${e.notes || ''} ${e.action || ''}`.toLowerCase();
          return s.includes(search);
        });
      }

      renderTable(result);
      updateStats(result);
    }

    function resetFilters() {
      document.getElementById('fSearch').value = '';
      document.getElementById('fEntity').value = '';
      document.getElementById('fAction').value = '';
      document.getElementById('fFrom').value = '';
      document.getElementById('fTo').value = '';
      renderTable(allEntries);
      updateStats(allEntries);
    }

    // ---------- ACTION LABEL MAP ----------
    const ACTION_LABELS = {
      // Inventory
      'inventory.added':            'Added',
      'inventory.taken_out':        'Taken Out',
      'inventory.assigned':         'Assigned',

      // Requests
      'request.created':            'Requested',
      'request.approved':           'Approved',
      'request.rejected':           'Rejected',
      'request.quotation_approved': 'Quote Approved',
      'request.quotation_rejected': 'Quote Rejected',
      'request.completed':          'Completed',

      // Quotation
      'quotation.uploaded':         'Quotation Uploaded',

      // Purchase Orders
      'po.created':                 'Purchased',
      'po.received':                'PO Received',

      // Loans
      'loan.created':               'Loaned Out',
      'loan.returned':              'Returned',
      'loan.paid':                  'Paid'
    };

    function prettyAction(action, toStatus) {
      if (!action) return '—';

      // Status changes → show the destination status as the label
      if (action === 'request.status_changed' && toStatus) {
        return toStatus.replace(/_/g, ' ');
      }

      if (ACTION_LABELS[action]) return ACTION_LABELS[action];

      return action
        .replace(/^inventory\./, '')
        .replace(/^request\./, '')
        .replace(/^quotation\./, '')
        .replace(/^po\./, '')
        .replace(/^loan\./, '')
        .replace(/_/g, ' ');
    }

    // ---------- ACTION COLOR KEY ----------
    function actionClass(action, toStatus) {
      if (!action) return 'added';

      // Status changes → color by destination status
      if (action === 'request.status_changed' && toStatus) {
        return String(toStatus).toLowerCase();
      }

      // Otherwise → last part of action ('inventory.taken_out' → 'taken_out')
      return action.split('.').pop();
    }

    function formatTime(ts) {
      const d = new Date(ts);
      if (isNaN(d)) return { date: '—', time: '' };
      const date = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      return { date, time };
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ---------- PAGE LOAD ----------
    document.addEventListener('DOMContentLoaded', async function () {
      await checkAuth();
      if (currentUser) {
        await loadActionOptions();
        loadAudit();

        document.getElementById('fSearch').addEventListener('keypress', function (e) {
          if (e.key === 'Enter') applyFilters();
        });
      }
    });
  </script>
  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>
</body>
</html>
